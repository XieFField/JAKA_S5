use_gazebo: false
command_in_type: speed_units

scale:
  linear: 0.10
  rotational: 1.0
  joint: 0.5

publish_period: 0.01
low_latency_mode: false
command_out_type: trajectory_msgs/JointTrajectory
publish_joint_positions: true
publish_joint_velocities: true
publish_joint_accelerations: false
# Absolute-position low-pass filtering attenuates feedback-relative velocities
# in Servo 2.5.9. The MuJoCo stream executor supplies force-limited dynamics.
smoothing_filter_plugin_name: massage_motion/MujocoServoSmoothing
is_primary_planning_scene_monitor: false

move_group_name: jaka_s5
planning_frame: world
ee_frame_name: massage_tool_tip
robot_link_command_frame: world

incoming_command_timeout: 0.1
num_outgoing_halt_msgs_to_publish: 4
lower_singularity_threshold: 17.0
hard_stop_singularity_threshold: 30.0
joint_limit_margin: 0.1
leaving_singularity_threshold_multiplier: 2.0

cartesian_command_in_topic: /servo_node/delta_twist_cmds
joint_command_in_topic: /servo_node/delta_joint_cmds
joint_topic: /joint_states
status_topic: /massage/cartesian_jog/status
command_out_topic: /jaka_s5_controller/joint_trajectory

check_collisions: true
collision_check_rate: 20.0
self_collision_proximity_threshold: 0.01
scene_collision_proximity_threshold: 0.02
